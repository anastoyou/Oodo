services:
  db:
    image: postgres:16-alpine
    container_name: odoo-prod-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${DB_USER:-odoo}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-prod-db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-odoo} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: odoo-prod-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ODOO_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - ./odoo:/opt/app/odoo:ro
      - ./addons:/opt/app/addons:ro
      - ./scripts:/opt/app/scripts:ro
      - ./odoo.conf:/opt/app/odoo.conf:ro
      - ./data:/opt/app/data
      - ./backups:/opt/app/backups

  nginx:
    image: nginx:1.27-alpine
    container_name: odoo-prod-nginx
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  odoo-prod-db-data:

