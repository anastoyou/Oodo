# Standalone shared PostgreSQL 16 server for any project on this device.
# Start manually: docker compose up -d
# - Local / host apps: localhost:${POSTGRES_PORT:-5432}
# - Other Docker Compose projects: join external network `shared-db-network`
#   and connect to host `shared-postgres` (or `postgres` / `shared-db`) on port 5432.
name: shared-postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: shared-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - shared-postgres-data:/var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      shared-db-network:
        aliases:
          - shared-postgres
          - postgres
          - shared-db

  # Development-only Cloudflare Tunnel (not included in docker-compose.prod.yml)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: odoo-dev-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --config /etc/cloudflared/config.yml run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - shared-db-network

volumes:
  shared-postgres-data:
    name: shared-postgres-data

networks:
  shared-db-network:
    name: shared-db-network
    driver: bridge
