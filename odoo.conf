[options]
# Local defaults so `odoo-bin -c odoo.conf` runs directly against the standalone PostgreSQL server.
# scripts/odoo_ctl.py and deploy/entrypoint.sh override DB, port, and admin settings from .env into data/odoo.runtime.conf.
http_interface = 0.0.0.0
http_port = 8069
addons_path = E:\Code\Oodo\odoo\addons,E:\Code\Oodo\addons
data_dir = E:\Code\Oodo\data
list_db = True
admin_passwd = masteradmin
db_host = localhost
db_port = 5432
db_user = postgres
db_password = postgres
